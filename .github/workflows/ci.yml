name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-site:
    name: Public site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Lint public site
        run: npm run lint:site
      - name: Typecheck public site
        run: npm run typecheck:site
      - name: Build public site
        run: npm run build:site

  admin:
    name: Admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root lint dependencies
        run: npm install --no-audit --no-fund
      - name: Install admin dependencies
        run: npm install --prefix apps/admin --no-audit --no-fund
      - name: Lint admin
        run: npm run lint:admin
      - name: Typecheck admin
        run: npm --prefix apps/admin run typecheck
      - name: Build admin
        run: npm --prefix apps/admin run build
